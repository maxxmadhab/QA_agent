{% extends "base.html" %}

{% block title %}Sessions – QA Agent{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-4 pb-2">
  <div>
    <h1 style="font-family: var(--font-serif); font-size: 2.25rem; font-weight: 500; margin: 0; color: var(--ink);">Test Sessions</h1>
    <p class="text-muted" style="margin: 0.25rem 0 0 0; font-size: 0.95rem;">Review past test runs, compliance audits, and regression reports.</p>
  </div>
  <div class="flex items-center gap-3">
    <div style="position: relative;">
      <input type="search" id="search" class="form-input" placeholder="Filter by domain or URL…" style="padding-left: 2.25rem; width: 260px; font-size: 0.88rem; border-radius: var(--radius-pill);">
      <svg style="position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--text-muted); pointer-events: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </div>
    <a href="/quick-test" class="btn btn-primary" style="border-radius: var(--radius-pill); padding: 0.55rem 1.25rem;">+ New Test</a>
  </div>
</div>

<div id="active-jobs-container" class="mb-4"></div>

<div id="sessions-container">
  <div class="card p-5 text-center text-muted">
    <div style="font-size: 1.1rem; margin-bottom: 0.5rem;">Loading test sessions…</div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='sessions.js') }}"></script>
{% endblock %}
