{% extends "base.html" %}

{% block title %}Sessions – QA Agent{% endblock %}

{% block content %}
<div class="sessions-header">
  <div class="sessions-header-left">
    <h1 class="sessions-title">Test Sessions</h1>
    <p class="sessions-subtitle">Review past test runs, compliance audits, and regression reports.</p>
  </div>
  <div class="sessions-header-actions">
    <div class="sessions-search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="search" id="search" class="sessions-search-input" placeholder="Search domain, URL, or ID…">
    </div>
    <a href="/quick-test" class="btn new-test-top-btn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      New Test
    </a>
  </div>
</div>

<!-- Active Runs Notification Container -->
<div id="active-jobs-container"></div>

<!-- Domain Filter Pills -->
<div id="domain-filters" class="domain-filter-bar" style="display: none;"></div>

<!-- Individual Sessions List -->
<div id="sessions-container">
  <div class="card p-5 text-center text-muted">
    <div style="font-size: 1.05rem;">Loading test sessions…</div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='sessions.js') }}"></script>
{% endblock %}
